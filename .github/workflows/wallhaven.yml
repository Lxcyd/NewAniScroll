# Wallhaven : TOUTE la categorie Anime, etiquetee, attribuee aux animes par ses tags.
#
# Chaine (31/10/2026, cf. tools/wallhaven/socle.mjs `preparerChaine`) :
#   1. catalogue.mjs --complet : les 88 625 images de la categorie Anime aux
#      filtres de la galerie (3 693 pages, ~1 h 35, reprenable) ; une fois fini,
#      les pages recentes seulement (nouveautes + favoris de moins de 30 jours).
#   2. etiquette.mjs : une requete par image (ses tags), les plus aimees d'abord.
#   3. attribuer.mjs : tags -> titres AniList -> franchise, dans wallhaven_image
#      (la table que lit la galerie). Aucune requete a Wallhaven.
#
# Wallhaven permet 45 requetes / minute, les scripts en font 40, une seule
# machine a la fois (`concurrency`). TROIS creneaux de 5 h 20 par jour, HORS de
# la nuit (03:17-08:00 UTC) ou les copies anime-sama / voir-anime prennent les
# 20 machines que GitHub accorde. ~88 000 images a etiqueter : ~3 jours, puis
# chaque creneau n'a plus que l'increment et s'arrete en quelques minutes.
#
# Cout Turso : ~20 lignes ecrites par image etiquetee (l'image, ses tags, ses
# lignes de galerie), ~2 M au total sur 10 M d'ecritures par mois ; lectures
# ~30 000 par creneau. Depot public : minutes GitHub gratuites.
#
# Secrets : TURSO_DATABASE_URL / TURSO_AUTH_TOKEN, TURSO_FANARTS_*.

name: wallhaven

on:
  schedule:
    - cron: "10 8 * * *"
    - cron: "40 13 * * *"
    - cron: "10 19 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Duree d'etiquetage (minutes)"
        default: "320"

concurrency:
  group: wallhaven
  cancel-in-progress: false

jobs:
  wallhaven:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install only what the scripts need
        # package.json mis de cote le temps de l'installation (sinon npm installe
        # tout le site) puis remis : lib/wallhaven/criteres.js est un module ES.
        run: mv package.json /tmp/pkg.json; rm -f package-lock.json; ok=1; for i in 1 2 3; do npm install --no-save @libsql/client@^0.17 && ok=0 && break; sleep 20; done; mv /tmp/pkg.json package.json; exit $ok
      - name: Catalogue
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_FANARTS_DATABASE_URL: ${{ secrets.TURSO_FANARTS_DATABASE_URL }}
          TURSO_FANARTS_AUTH_TOKEN: ${{ secrets.TURSO_FANARTS_AUTH_TOKEN }}
        run: echo "DEBUT=$(date +%s)" >> "$GITHUB_ENV" && node tools/wallhaven/catalogue.mjs --complet --minutes=110
      - name: Etiquetage
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_FANARTS_DATABASE_URL: ${{ secrets.TURSO_FANARTS_DATABASE_URL }}
          TURSO_FANARTS_AUTH_TOKEN: ${{ secrets.TURSO_FANARTS_AUTH_TOKEN }}
        # Le reste du creneau, moins 15 min pour l'attribution.
        run: |
          RESTE=$(( ${{ inputs.minutes || '320' }} - ($(date +%s) - DEBUT) / 60 - 15 ))
          [ "$RESTE" -gt 5 ] && node tools/wallhaven/etiquette.mjs --minutes=$RESTE || echo "creneau epuise"
      - name: Attribution
        if: ${{ !cancelled() }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_FANARTS_DATABASE_URL: ${{ secrets.TURSO_FANARTS_DATABASE_URL }}
          TURSO_FANARTS_AUTH_TOKEN: ${{ secrets.TURSO_FANARTS_AUTH_TOKEN }}
        run: node tools/wallhaven/attribuer.mjs
