# Entretient `player_map`, la table qui fait disparaitre le chemin froid.
#
# Une ligne `verified` transforme la resolution anime-sama / voir-anime en UNE
# requete au lieu de la marche complete (recherche catalogue, detection de
# saison, page detail, panneaux). Au 20/09/2026 la table couvre 3 881 animes :
# au-dela, chaque premiere ouverture paie le chemin long, et c'est exactement ce
# qu'on ressent quand frembed n'a pas la serie.
#
# Le script existait deja (scripts/player-map/verify-player-map.mjs) mais rien
# ne le lancait. Il reprend les lignes `heuristic` et celles dont l'echeance est
# passee, les re-derive avec le resolveur ACTUEL, et promeut ou retrograde.
#
# BUDGET. C'est le seul travail de cette liste qui appelle le site, donc qui
# consomme des invocations Vercel : `--limit` les borne. `--concurrency=4` garde
# la charge basse sur les sites scrapes en amont — on n'est pas presses, c'est
# une passe de fond.
#
# 500 par nuit, et non 150 : mesure du 20/09/2026, un lot de 150 prend 1 min 29
# a concurrence 4, soit ~0,6 s par ligne. L'arriere accumule etait de 4 217
# lignes — a 150 par nuit il ne se resorbait pas, chaque journee en produisant
# de nouvelles. 500 le vide en une semaine et tient dans le timeout.
#
# `from` choisit la liste de travail :
#   due       (defaut) les lignes echues et les `heuristic`
#   seed      les lignes `verified` d'un algorithme perime — elles viennent d'un
#             semis, pas d'un controle, et le chemin de lecture les honore sans
#             reserve. A drainer en priorite (2 315 lignes au 20/09/2026 ; sur
#             un echantillon de 150, 135 se re-confirment, 6 cassent, 9 sont
#             absentes : le semis etait juste a ~90 %, simplement jamais audite).
#   mydublist les titres doubles en francais qu'on n'a JAMAIS sondes en VF
#             (1 295 au 20/09/2026) — des doublages que le site pourrait offrir.
#
# Vise dev par defaut : la prod n'a pas a servir de banc d'essai a une passe de
# maintenance, et les deux comptes partagent la meme base Turso.
#
# Secrets requis :
#   TURSO_DATABASE_URL / TURSO_AUTH_TOKEN

name: warm-player-map

on:
  schedule:
    - cron: "20 4 * * *" # 04:20 UTC, apres la synchro du catalogue frembed
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de titres a verifier"
        required: false
        default: "500"
      from:
        description: "Liste de travail : due | seed | mydublist"
        required: false
        default: "due"
      site:
        description: "Site interroge (dev par defaut)"
        required: false
        default: "https://dev.aniscroll.com"
      dry:
        description: "Ne rien ecrire"
        required: false
        type: boolean
        default: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install only what the script needs
        run: npm install --no-save @libsql/client@^0.17

      - name: Verify a bounded batch
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node scripts/player-map/verify-player-map.mjs \
            --site=${{ inputs.site || 'https://dev.aniscroll.com' }} \
            --limit=${{ inputs.limit || '500' }} \
            --from=${{ inputs.from || 'due' }} \
            --concurrency=4 \
            ${{ inputs.dry == true && '--dry' || '' }}
