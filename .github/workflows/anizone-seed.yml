# Range les episodes d'anizone dans Turso (anizone_ep / anizone_sub).
#
# anizone.to et son CDN refusent les IP de Vercel et de notre Worker (403,
# mesure le 25/11/2026) : le site ne peut rien lire chez eux et sert ce que
# ce cron a range. Tout ce qu'on en tire est stable (URL a l'uuid, sans jeton).
# Detail : lib/anizone/core.mjs et l'en-tete de tools/anizone/seed.mjs.
#
# Chaque heure, dans l'ordre, jusqu'a 45 min :
#   1. les episodes ouverts par un visiteur et absents (file anizone_demande) ;
#   2. les nouveaux episodes des titres en cours ;
#   3. la decouverte du reste du catalogue, par popularite AniList.
#
# GitHub (Azure) recoit en direct un TEST anti-robot de Cloudflare
# (cf-mitigated: challenge, 25/11). D'ou une CASCADE, arretee au premier moyen
# qui passe (tools/anizone/transport.mjs) :
#   a. direct avec des en-tetes de Chrome ;
#   b. un Chrome lance « a la main » sur ecran virtuel, qui passe le test
#      (clic X11 sur la case s'il le faut), puis son cookie cf_clearance ;
#   c. si a et b echouent : sortie par Tor, puis b a nouveau.
# (WARP essaye le 25/11 : « Attention Required! » partout — retire.)
# Le journal de l'etape « Sonde » dit lequel a marche, et decrit chaque refus.
#
# Secrets requis (Repository → Settings → Secrets and variables → Actions) :
#   TURSO_DATABASE_URL   → la base aniscroll-cache
#   TURSO_AUTH_TOKEN

name: anizone-seed

on:
  schedule:
    - cron: "17 * * * *" # chaque heure
  workflow_dispatch:
    inputs:
      ids:
        description: "Ids AniList precis (virgules) — vide = mode automatique"
        required: false
        type: string
        default: ""
      dry:
        description: "Ne rien ecrire, seulement rapporter"
        required: false
        type: boolean
        default: false
      tor:
        description: "Passer par Tor d'emblee"
        required: false
        type: boolean
        default: false

# Deux passages ne se chevauchent jamais : ils liraient la meme file.
concurrency:
  group: anizone-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      CHROME_PATH: /usr/bin/google-chrome
      # Le bac a sable de Chrome bute sur l'AppArmor d'Ubuntu 24 en CI.
      ANIZONE_NO_SANDBOX: "1"

    steps:
      # Le code vient de `dev` : GitHub ne lance un cron que depuis `main`, mais
      # le script et lib/anizone/core.mjs n'existent que sur dev tant que la
      # release n'est pas faite. Ce fichier seul est pose sur main (inerte pour
      # Vercel, cf. tools/quota-guard/should-build.sh).
      - uses: actions/checkout@v5
        with:
          ref: dev

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Dans un dossier a part : `npm install` dans le depot installerait tout
      # le site. NODE_PATH ne vaut pas pour `import` : on donne le chemin.
      - name: Install only what the script needs
        run: |
          mkdir -p /tmp/az && cd /tmp/az && npm init -y >/dev/null
          npm install --silent @libsql/client@^0.17 playwright-core@^1.50
          ln -s /tmp/az/node_modules "$GITHUB_WORKSPACE/node_modules"
          echo "PLAYWRIGHT_CORE=/tmp/az/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool
          google-chrome --version

      # Ecran virtuel realiste : le defaut de xvfb-run (640x480, 8 bits) se remarque.
      - name: Sonde (direct, puis Chrome)
        id: sonde
        if: ${{ inputs.tor != true }}
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1366x768x24" node tools/anizone/seed.mjs --sonde

      - name: Tor (si la sonde a echoue)
        if: ${{ inputs.tor == true || steps.sonde.outcome != 'success' }}
        run: |
          sudo apt-get install -y -qq tor
          sudo systemctl start tor || sudo service tor start
          for i in $(seq 1 30); do
            curl -s --max-time 10 --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip && break
            sleep 3
          done
          echo
          echo "ANIZONE_PROXY=socks5://127.0.0.1:9050" >> "$GITHUB_ENV"
          ANIZONE_PROXY=socks5://127.0.0.1:9050 xvfb-run -a -s "-screen 0 1366x768x24" node tools/anizone/seed.mjs --sonde

      - name: Seed
        env:
          IDS: ${{ inputs.ids }}
        run: |
          if [ -n "$IDS" ]; then MODE="--ids $IDS"; else MODE="--auto"; fi
          xvfb-run -a -s "-screen 0 1366x768x24" node tools/anizone/seed.mjs $MODE --budget 45 ${{ inputs.dry == true && '--dry' || '' }}
