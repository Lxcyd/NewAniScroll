# Range les episodes d'anizone dans Turso (anizone_ep / anizone_sub).
#
# anizone.to et son CDN refusent les IP de Vercel et de notre Worker (403,
# mesure le 25/11/2026) : le site ne peut rien lire chez eux et sert ce que
# ce cron a range. Tout ce qu'on en tire est stable (URL a l'uuid, sans jeton).
# Detail : lib/anizone/core.mjs et l'en-tete de tools/anizone/seed.mjs.
#
# Chaque heure, dans l'ordre, jusqu'a 45 min :
#   1. les episodes ouverts par un visiteur et absents (file anizone_demande) ;
#   2. les nouveaux episodes des titres en cours ;
#   3. la decouverte du reste du catalogue, par popularite AniList.
#
# GitHub (Azure) est refuse lui aussi en direct (403 le 25/11). D'ou une
# CASCADE, arretee au premier moyen qui passe :
#   a. direct avec des en-tetes de Chrome (tools/anizone/transport.mjs) ;
#   b. un vrai Chrome sur ecran virtuel, qui passe le test anti-robot ;
#   c. si a et b echouent : sortie par Cloudflare WARP (autres IP), puis a et b
#      a nouveau.
# Le journal de l'etape « Sonde » dit lequel a marche, et decrit chaque refus.
#
# Secrets requis (Repository → Settings → Secrets and variables → Actions) :
#   TURSO_DATABASE_URL   → la base aniscroll-cache
#   TURSO_AUTH_TOKEN

name: anizone-seed

on:
  schedule:
    - cron: "17 * * * *" # chaque heure
  workflow_dispatch:
    inputs:
      ids:
        description: "Ids AniList precis (virgules) — vide = mode automatique"
        required: false
        type: string
        default: ""
      dry:
        description: "Ne rien ecrire, seulement rapporter"
        required: false
        type: boolean
        default: false
      warp:
        description: "Passer par WARP d'emblee"
        required: false
        type: boolean
        default: false

# Deux passages ne se chevauchent jamais : ils liraient la meme file.
concurrency:
  group: anizone-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      CHROME_PATH: /usr/bin/google-chrome

    steps:
      # Le code vient de `dev` : GitHub ne lance un cron que depuis `main`, mais
      # le script et lib/anizone/core.mjs n'existent que sur dev tant que la
      # release n'est pas faite. Ce fichier seul est pose sur main (inerte pour
      # Vercel, cf. tools/quota-guard/should-build.sh).
      - uses: actions/checkout@v5
        with:
          ref: dev

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Dans un dossier a part : `npm install` dans le depot installerait tout
      # le site. NODE_PATH ne vaut pas pour `import` : on donne le chemin.
      - name: Install only what the script needs
        run: |
          mkdir -p /tmp/az && cd /tmp/az && npm init -y >/dev/null
          npm install --silent @libsql/client@^0.17 playwright-core@^1.50
          ln -s /tmp/az/node_modules "$GITHUB_WORKSPACE/node_modules"
          echo "PLAYWRIGHT_CORE=/tmp/az/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          command -v xvfb-run || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          google-chrome --version

      - name: Sonde (direct, puis navigateur)
        id: sonde
        if: ${{ inputs.warp != true }}
        continue-on-error: true
        run: xvfb-run -a node tools/anizone/seed.mjs --sonde

      - name: WARP (si la sonde a echoue)
        if: ${{ inputs.warp == true || steps.sonde.outcome != 'success' }}
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do
            warp-cli --accept-tos status | grep -q Connected && break
            sleep 2
          done
          warp-cli --accept-tos status
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp|colo)='
          xvfb-run -a node tools/anizone/seed.mjs --sonde

      - name: Seed
        env:
          IDS: ${{ inputs.ids }}
        run: |
          if [ -n "$IDS" ]; then MODE="--ids $IDS"; else MODE="--auto"; fi
          xvfb-run -a node tools/anizone/seed.mjs $MODE --budget 45 ${{ inputs.dry == true && '--dry' || '' }}
