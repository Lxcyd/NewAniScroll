name: usage-monitor

# Daily diagnostic snapshot of Upstash keyspace + daily requests + Vercel deploys.
# Writes tools/usage-monitor/{snapshots/*.json,LATEST.md,HISTORY.md} and commits
# them so the history builds up for day-over-day deltas.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN   (live aniscroll-cache DB)
# Optional:
#   UPSTASH_EMAIL, UPSTASH_API_KEY  (daily-requests chart + cap projection)
#   VERCEL_TOKEN, VERCEL_PROJECT_ID, VERCEL_TEAM_ID  (deploy correlation)

on:
  schedule:
    - cron: "20 6 * * *" # 06:20 UTC daily (after the UTC-day rollover)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: usage-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect usage snapshot
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          UPSTASH_DATABASE_ID: ${{ secrets.UPSTASH_DATABASE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: node tools/usage-monitor/collect.mjs

      - name: Commit snapshot + reports
        run: |
          git config user.name "usage-monitor[bot]"
          git config user.email "usage-monitor@users.noreply.github.com"
          git add tools/usage-monitor/snapshots tools/usage-monitor/LATEST.md tools/usage-monitor/HISTORY.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "usage-monitor: snapshot $(date -u +%F) [skip ci]"
            git push
          fi
