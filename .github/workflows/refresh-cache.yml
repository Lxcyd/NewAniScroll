# Daily refresh of the Turso anime cache.
#
# Runs scripts/refresh-cache.mjs which:
#   1. Re-fetches every RELEASING and NOT_YET_RELEASED anime.
#   2. Re-fetches rows whose TTL has expired, most-recently-viewed first.
#   3. Discovers AniList IDs higher than what's in our DB.
#
# The script exits non-zero when any of the three fails, so an AniList outage
# turns this workflow red instead of passing silently — which is how a run that
# refreshed nothing at all used to look exactly like a healthy one.
#
# Schedule: 03:00 UTC every day (off-peak for AniList, before EU users wake).
# Also exposed as workflow_dispatch so we can trigger it manually from the
# Actions tab when we just bootstrapped or pushed schema changes.
#
# Secrets required (Repository → Settings → Secrets and variables → Actions):
#   TURSO_DATABASE_URL
#   TURSO_AUTH_TOKEN

name: refresh-cache

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      skip_airing:
        description: "Skip the RELEASING + NOT_YET_RELEASED refresh"
        required: false
        type: boolean
        default: false
      skip_ttl:
        description: "Skip the TTL refresh"
        required: false
        type: boolean
        default: false
      skip_discovery:
        description: "Skip the new-ID discovery sweep"
        required: false
        type: boolean
        default: false
      max_ttl_rows:
        description: "Expired rows the TTL refresh may take this run (default 6000)"
        required: false
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The TTL job stops itself at 20 minutes (--max-minutes), so this is only
    # the outer guard: airing window + discovery + that budget, with room for a
    # slow AniList. It must stay comfortably above the script's own budget, or
    # the process is killed mid-batch and a healthy run reads as a failure.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install only what the script needs
        # Avoids a full `npm ci` (Next.js + Vidstack are large and unrelated to
        # this script). dotenv is dev-only; @libsql/client is the prod dep.
        run: npm install --no-save @libsql/client@^0.17 dotenv@^17

      - name: Run refresh
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          node scripts/refresh-cache.mjs \
            ${{ inputs.skip_airing    == true && '--skip-airing'    || '' }} \
            ${{ inputs.skip_ttl       == true && '--skip-ttl'       || '' }} \
            ${{ inputs.skip_discovery == true && '--skip-discovery' || '' }} \
            ${{ inputs.max_ttl_rows   != ''   && format('--max-ttl-rows={0}', inputs.max_ttl_rows) || '' }}
