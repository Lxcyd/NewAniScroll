# Warms the Cloudflare Worker proxy (fanart-proxy.aniscroll.com) so every
# clearart/banner/cover is already in its 1-year edge cache. Cuts the
# first-paint for those images from ~800ms (fanart.tv origin) to ~50ms
# (CF edge in the user's region).
#
# On the SCHEDULE this runs the image warmer only. The /en/anime/[id] page
# walk is dispatch-only — see the comment on that step for why it was the
# site's biggest self-inflicted Vercel cost.
#
# Schedule: every Monday 05:00 UTC, after refresh-fanarts has run.
# Also dispatchable manually from the Actions tab.
#
# Required secrets:
#   TURSO_FANARTS_DATABASE_URL
#   TURSO_FANARTS_AUTH_TOKEN
#
# Optional secret:
#   SITE_URL  (default https://www.aniscroll.com)

name: warm-cache

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "FULL mode (re-warm all anime, slow)"
        required: false
        type: boolean
        default: false
      since_days:
        description: "Delta window in days (ignored if full)"
        required: false
        type: string
        default: "7"
      limit:
        description: "Max number of anime to warm (blank = all)"
        required: false
        type: string
      concurrency:
        description: "Parallel requests"
        required: false
        type: string
        default: "8"
      images_since_days:
        description: "AVIF-warm images for anime fetched in last N days (delta only — bulk warming is done locally)"
        required: false
        type: string
        default: "7"
      images_types:
        description: "Comma-separated fanart types (default: clearart only to stay under free tier)"
        required: false
        type: string
        default: "clearart,hdmovieclearart"

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install libsql client
        run: npm install --no-save @libsql/client

      # MANUAL ONLY — never on the daily schedule. This step fetches the full
      # SSR HTML of /en/anime/{id} for every delta anime, and it was measured
      # as the site's single largest self-inflicted cost:
      #
      #   - 56.4% of all Edge Requests landed on the Cleveland PoP (vs 15.6%
      #     Paris) — GitHub runners are in US datacenters, so the walk warms a
      #     CDN edge nobody browses from. French visitors never see that cache.
      #   - /en/anime/[...id] is the top Active CPU route AND sat at 1.2% CDN
      #     hit rate: each walked id is a distinct cache key, rendered cold,
      #     then thrown away.
      #   - ~170 KB of SSR HTML per page straight into Fast Origin Transfer,
      #     whose Hobby quota is only 10 GB (was sitting at 40%).
      #
      # And it never achieved its stated goal: a Node `fetch()` does not parse
      # HTML or load subresources, so it cannot make the Cloudflare Worker
      # ingest any fanart. The image warming that actually works is the
      # `warm-images.mjs` step below, which hits fanart-proxy directly.
      #
      # Kept dispatchable for the one case that genuinely needs it: seeding the
      # whole catalog with `--full` right after a deploy that changes the page.
      - name: Run page warmer
        if: github.event_name == 'workflow_dispatch'
        env:
          TURSO_FANARTS_DATABASE_URL: ${{ secrets.TURSO_FANARTS_DATABASE_URL }}
          TURSO_FANARTS_AUTH_TOKEN: ${{ secrets.TURSO_FANARTS_AUTH_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://aniscroll.com' }}
        run: |
          ARGS=""
          if [ "${{ inputs.full }}" = "true" ]; then
            ARGS="$ARGS --full"
          elif [ -n "${{ inputs.since_days }}" ]; then
            ARGS="$ARGS --since-days=${{ inputs.since_days }}"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi
          if [ -n "${{ inputs.concurrency }}" ]; then
            ARGS="$ARGS --concurrency=${{ inputs.concurrency }}"
          fi
          node scripts/cache/warm-cache.mjs $ARGS

      # Delta-only image warming: just the anime added/refreshed in the last
      # N days. Bulk back-fill of the existing catalog is done locally via
      # `node scripts/cache/warm-images.mjs --limit=4000` to preserve the CF
      # 5000 transformations/month free tier and avoid GH job timeouts.
      - name: Run image warmer (delta AVIF)
        env:
          TURSO_FANARTS_DATABASE_URL: ${{ secrets.TURSO_FANARTS_DATABASE_URL }}
          TURSO_FANARTS_AUTH_TOKEN: ${{ secrets.TURSO_FANARTS_AUTH_TOKEN }}
        run: |
          SINCE="${{ inputs.images_since_days }}"
          SINCE="${SINCE:-7}"
          TYPES="${{ inputs.images_types }}"
          TYPES="${TYPES:-clearart,hdmovieclearart}"
          # --budget caps how many NEW CF transformations (5,000/month free
          # tier) a scheduled run may consume; already-cached variants are
          # free and don't count. Keeps the daily delta from ever draining
          # the month's quota on its own.
          ARGS="--since-days=$SINCE --types=$TYPES --budget=300"
          if [ -n "${{ inputs.concurrency }}" ]; then
            ARGS="$ARGS --concurrency=${{ inputs.concurrency }}"
          fi
          node scripts/cache/warm-images.mjs $ARGS
