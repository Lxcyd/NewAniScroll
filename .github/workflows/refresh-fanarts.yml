# Daily delta refresh of the fanart cache.
#
# Two-step pipeline:
#   1. refresh-fanarts.mjs — uses fanart.tv /latest?date= to find anime
#      whose images changed since last run, then re-pulls those entries.
#      INSERT OR IGNORE so existing rows aren't duplicated.
#   2. classify-fanarts.mjs — classifies any rows where nsfw_label IS NULL
#      (i.e. only the new ones that step 1 just added).
#
# Schedule: 04:00 UTC every day (after the AniList refresh at 03:00 UTC).
# Also exposes workflow_dispatch for manual runs from the Actions tab.
#
# Required secrets (Repo → Settings → Secrets and variables → Actions):
#   TURSO_DATABASE_URL
#   TURSO_AUTH_TOKEN
#   FANART_API_KEY

name: refresh-fanarts

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      skip_classify:
        description: "Skip the NSFW classifier step"
        required: false
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ÉTAPE 1 — seulement ce dont le rafraîchissement a besoin.
      # `refresh-fanarts.mjs` n'importe que dotenv + @libsql/client, et NI L'UN
      # NI L'AUTRE n'a de script d'installation (vérifié). `--ignore-scripts`
      # garantit donc qu'aucun binaire n'est téléchargé ici — c'est ce qui rend
      # l'isolation réelle : les quatre paquets étant déjà déclarés dans
      # package.json, un `npm install` nu réconcilie tout l'arbre et rappellerait
      # le postinstall d'onnxruntime-node malgré la séparation des étapes.
      #
      # Le 08/08 ce postinstall (qui télécharge un binaire natif) a expiré sur
      # ETIMEDOUT et a fait échouer TOUT le workflow — y compris le
      # rafraîchissement, qui n'en a aucun besoin. Une dépendance du classifieur
      # ne doit pas coûter la donnée.
      - name: Install refresh deps
        run: npm install --no-save --ignore-scripts @libsql/client@^0.17 dotenv@^17

      - name: Refresh fanarts (delta)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          FANART_API_KEY:     ${{ secrets.FANART_API_KEY }}
        run: node scripts/refresh-fanarts.mjs

      # ÉTAPE 2 — le classifieur, et lui seul, paie ses dépendances.
      # Rien de tout ce qui suit ne s'exécute quand skip_classify est demandé.
      - name: Install classifier deps
        if: ${{ inputs.skip_classify != true }}
        # `npm rebuild` EST INDISPENSABLE, ne pas le retirer. Les deux paquets
        # sont déjà dans package.json, donc l'étape 1 les a installés au passage
        # — mais avec `--ignore-scripts`, donc SANS leur binaire natif. npm les
        # voit alors à la bonne version et ne rejoue pas leurs scripts : sharp
        # reste posé mais infirme et casse à l'exécution sur
        #   Cannot find module '../build/Release/sharp-linux-x64.node'
        # (constaté sur le run 31259166354). `npm rebuild` rejoue install/
        # postinstall pour ces paquets précis, c'est ce qui télécharge le binaire.
        #
        # Ce téléchargement vit dans les scripts du paquet, hors du contrôle des
        # `fetch-retries` de npm : la seule reprise possible est de relancer la
        # commande. 3 essais, 15 s puis 30 s.
        run: |
          for attempt in 1 2 3; do
            if npm install --no-save onnxruntime-node@^1.25 sharp@^0.32 \
               && npm rebuild --foreground-scripts onnxruntime-node sharp; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "::warning::install du classifieur echoue (essai $attempt/3) — nouvel essai dans ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::install du classifieur echoue apres 3 essais"
          exit 1

      - name: Cache the WD14 classifier model
        if: ${{ inputs.skip_classify != true }}
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: wd-swinv2-v3-v1

      - name: Download WD14 model if missing
        if: ${{ inputs.skip_classify != true }}
        run: |
          if [ ! -f .cache/models/wd-swinv2-v3.onnx ] || [ ! -f .cache/models/wd-swinv2-v3-tags.csv ]; then
            node scripts/download-wd14-model.mjs
          fi

      - name: Classify new fanarts
        if: ${{ inputs.skip_classify != true }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
        # GitHub Actions runners have 4 vCPUs — match that.
        # The classifier only loops over rows where nsfw_label IS NULL, so
        # this only touches rows the refresh step just added.
        run: node scripts/classify-fanarts.mjs --concurrency=4
