# Cache disque devant Next. Il suit les en-tetes du site (s-maxage, private,
# no-store, Set-Cookie) : ce que Next ne declare pas cachable ne l'est pas.
worker_processes auto;
events { worker_connections 4096; }

http {
  # Pages et API : 5 Go, oubliees apres 7 jours sans visite.
  proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:64m max_size=5g inactive=7d use_temp_path=off;
  # JS/CSS du build : gardes 30 jours MEME apres un deploiement — une page
  # encore en cache qui reclame un ancien chunk le trouve ici (la protection
  # que Vercel fait payer).
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:16m max_size=3g inactive=30d use_temp_path=off;

  # Meme liste que le rewrite mobile de next.config.js : la fiche anime a deux
  # mises en page, il faut deux entrees de cache.
  map $http_user_agent $mobile {
    default 0;
    "~(Android|android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini)" 1;
  }

  upstream next { server web:3000; keepalive 32; }

  server {
    listen 80;
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_read_timeout 120s;
    # Streaming (download-stream, SSE) : ne pas tamponner.
    proxy_request_buffering off;

    location /_next/static/ {
      proxy_pass http://next;
      proxy_cache static;
      proxy_cache_valid 200 30d;
      add_header X-Cache $upstream_cache_status;
    }

    location / {
      proxy_pass http://next;
      proxy_cache pages;
      proxy_cache_key "$host$request_uri|m$mobile";
      proxy_cache_lock on;
      proxy_cache_lock_timeout 10s;
      proxy_cache_background_update on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_revalidate on;
      add_header X-Cache $upstream_cache_status;
    }
  }
}
