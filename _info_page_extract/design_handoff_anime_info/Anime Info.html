<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<style>
  :root {
    --bg-0: #0a0b10;
    --bg-1: #10121a;
    --bg-2: #161924;
    --bg-3: #1d2030;
    --line: #252938;
    --line-2: #2f3447;
    --txt-0: #f4f5f8;
    --txt-1: #c4c8d4;
    --txt-2: #8a8fa3;
    --txt-3: #5e6478;
    --accent: #ff3b5c;
    --accent-2: #ff5c78;
    --accent-soft: rgba(255, 59, 92, 0.12);
    --gold: #f6c544;
    --blue: #4a8fff;
    --green: #2dd47a;
    --purple: #b07cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--txt-0); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; zoom: 0.75; }
  ::selection { background: var(--accent); color: white; }
  .display { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--txt-3); }
  /* Custom scrollbar for V12 scrollable lists */
  .custom-scroll::-webkit-scrollbar { width: 8px !important; display: block !important; }
  .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.04) !important; border-radius: 4px; }
  .custom-scroll::-webkit-scrollbar-thumb { background: var(--line-2) !important; border-radius: 4px; }
  .custom-scroll::-webkit-scrollbar-thumb:hover { background: var(--txt-3) !important; }
  .custom-scroll { scrollbar-width: thin !important; scrollbar-color: var(--line-2) rgba(255,255,255,0.04) !important; }
</style>
</head>
