name = "aniscroll-proxy"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Workers Free includes 100k requests/day and unmetered bandwidth — that's
# what we're here for. Workers Paid ($5/mo) raises the daily cap to 333k.
#
# Custom domain — REQUIRED for the edge cache. Cloudflare's Cache API
# (caches.default) is a NO-OP on *.workers.dev; it only works when the Worker
# runs on a custom domain attached to a zone. aniscroll.com is already on
# Cloudflare, so `wrangler deploy` provisions proxy.aniscroll.com and its DNS
# record automatically. The *.workers.dev URL stays live as a fallback.
# NEXT_PUBLIC_PROXY_BASE (Vercel) must point at https://proxy.aniscroll.com.
routes = [{ pattern = "proxy.aniscroll.com", custom_domain = true }]

# WORKERS CACHING en prod (27/11/2026), apres mesure sur le Worker de test :
# des le 2e passage, 34 a 43 segments megaplay sur ~100 servis par ce cache
# sans faire tourner le Worker (zero CPU), le reste par caches.default. Il est
# HIERARCHISE entre datacenters et regroupe les demandes simultanees d'un meme
# segment, ce que caches.default ne fait pas. Un hit compte toujours comme une
# requete (quota 100k/jour inchange). Retour arriere : enabled = false, puis
# `npx wrangler deploy`. Toute reponse sans Cache-Control part en no-store
# (cf. sansCacheParDefaut), sinon un 410 passager serait garde 3 min.
[cache]
enabled = true
cross_version_cache = true

# Observability is on by default — opt out only if you want to save log volume.
[observability]
enabled = true

# KV namespace backing the offloaded /w/health and /w/broadcast endpoints.
# The Worker READS this; the Next.js write side (anilist-health cron + admin
# broadcast POST) mirrors the cached value into the same namespace.
#
# Create it once and paste the returned id below:
#   wrangler kv namespace create W2G_CACHE
[[kv_namespaces]]
binding = "W2G_CACHE"
id = "2ae59b75a28947848063dbac5b433e23"

# Secrets used by /w/track (analytics → Turso over HTTP). Set them with:
#   wrangler secret put TURSO_ADMIN_URL     # libsql://<your-admin-db>.turso.io
#   wrangler secret put TURSO_ADMIN_TOKEN   # admin DB auth token
#
# Secret used by the Next.js side to write into KV via the REST API (NOT read
# by the Worker itself — listed here for documentation):
#   CF_ACCOUNT_ID, CF_KV_NAMESPACE_ID, CF_KV_API_TOKEN  (env on Vercel)


# ── WORKER DE TEST (27/11/2026) ──────────────────────────────────────────────
# proxy.aniscroll.com sert la prod ET la dev : on n'y essaie plus rien. Le
# projet Vercel dev pointe NEXT_PUBLIC_PROXY_BASE sur proxy-dev.aniscroll.com.
#   npx wrangler deploy --env dev
# Meme KV que la prod (le site dev y lit deja broadcast/diag). Domaine
# personnalise obligatoire, comme pour la prod (caches.default).
#
# WORKERS CACHING (`cache`), seulement ici tant que les mesures n'ont pas
# tranche : un cache DEVANT le Worker, hierarchise entre datacenters, qui
# regroupe les demandes simultanees d'un meme segment et sert les Range lui-
# meme ; un HIT ne fait pas tourner le Worker (zero CPU) et compte comme une
# requete, comme aujourd'hui. `cross_version_cache` : sans lui, chaque
# deploiement repartirait d'un cache vide (la version fait partie de la cle).
[env.dev]
name = "aniscroll-proxy-dev"
routes = [{ pattern = "proxy-dev.aniscroll.com", custom_domain = true }]

[env.dev.cache]
enabled = true
cross_version_cache = true

[[env.dev.kv_namespaces]]
binding = "W2G_CACHE"
id = "2ae59b75a28947848063dbac5b433e23"
