<title>Relevé OP/ED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#151922; --muted:#5a6376; --line:#d9dfe8;
  --accent:#3453c9; --accent-soft:#e3e9fb;
  --ok:#1b8a4b; --ok-soft:#dcf2e5; --bad:#c42c2c; --bad-soft:#f8e0e0;
  --warn:#a86400; --warn-soft:#f7ead3; --none:#6b7384; --none-soft:#e7eaf0;
  --op:#3453c9; --ed:#7a3fb8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1117; --surface:#161b24; --ink:#e5e9f0; --muted:#98a2b5; --line:#262d3a;
    --accent:#86a0ff; --accent-soft:#1f2a4a;
    --ok:#46c47f; --ok-soft:#163525; --bad:#ff7a7a; --bad-soft:#3d1c1f;
    --warn:#f0ad4e; --warn-soft:#3a2c14; --none:#9aa3b3; --none-soft:#232a36;
    --op:#86a0ff; --ed:#c39bf0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1117; --surface:#161b24; --ink:#e5e9f0; --muted:#98a2b5; --line:#262d3a;
  --accent:#86a0ff; --accent-soft:#1f2a4a;
  --ok:#46c47f; --ok-soft:#163525; --bad:#ff7a7a; --bad-soft:#3d1c1f;
  --warn:#f0ad4e; --warn-soft:#3a2c14; --none:#9aa3b3; --none-soft:#232a36;
  --op:#86a0ff; --ed:#c39bf0;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-inline:16px;padding-block:20px 60px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:34px;line-height:1.05}
h2{font-size:24px}
.tc{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
header{display:grid;gap:10px}
.lede{max-width:70ch;color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:130px}
.stat b{display:block;font:600 22px/1.2 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
select.chip{padding-right:26px}
.chip:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.anime{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.anime-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line)}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.07em;border-radius:4px;padding:2px 7px;background:var(--none-soft);color:var(--none)}
.row{display:grid;grid-template-columns:118px 44px 190px minmax(0,1fr);gap:6px 14px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.row:first-of-type{border-top:0}
.row.done{opacity:.62}
.where{font-weight:600}
.where small{display:block;font-weight:400;color:var(--muted)}
.kind{font:600 13px/1 "IBM Plex Mono",monospace;padding:5px 0;text-align:center;border-radius:4px;color:#fff}
.kind.op{background:var(--op)} .kind.ed{background:var(--ed)}
.timing b{font-size:15px}
.timing .src{font-size:12px;color:var(--muted)}
.body{display:grid;gap:8px}
.hosts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.host{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.claude{display:flex;gap:8px;align-items:baseline;font-size:13px}
.pill{font:600 11px/1 "IBM Plex Sans",sans-serif;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:4px 8px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.faux{background:var(--bad-soft);color:var(--bad)}
.pill.incertain{background:var(--warn-soft);color:var(--warn)} .pill.none{background:var(--none-soft);color:var(--none)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.go{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 10px;font-weight:500}
.go .tc{font-size:12px}
.verdict{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.btn[aria-pressed="true"].v-juste{background:var(--ok);border-color:var(--ok);color:#fff}
.btn[aria-pressed="true"].v-debut,.btn[aria-pressed="true"].v-fin,.btn[aria-pressed="true"].v-pas{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[aria-pressed="true"].v-manque{background:var(--warn);border-color:var(--warn);color:#fff}
.fix{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.fix input{width:84px;font:13px "IBM Plex Mono",monospace;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);color:var(--ink)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
details img{margin-top:8px;border-radius:6px;border:1px solid var(--line);width:100%;height:auto}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px 14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .row{grid-template-columns:1fr auto;}
  .row .timing{grid-column:1/-1}
  .row .body{grid-column:1/-1}
  .kind{padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Relevé OP/ED</h1>
    <p class="lede">Chaque ligne est un générique détecté sur un lecteur précis. Les liens ouvrent l'épisode sur dev.aniscroll.com, sur ce lecteur, 3 secondes avant le bord à vérifier. Un verdict par ligne ; en cas d'erreur, indique le bon temps (mm:ss).</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar" role="toolbar" aria-label="Filtres">
    <button class="chip" id="f-todo" aria-pressed="true">À vérifier</button>
    <button class="chip" id="f-all" aria-pressed="false">Tout</button>
    <label class="muted" for="f-anime">Animé</label>
    <select class="chip" id="f-anime"><option value="">Tous</option></select>
  </div>

  <div id="list"><div class="empty">Chargement du relevé…</div></div>

  <p class="note" id="note" hidden></p>
</div>

<script>
(function(){
  const DEV = "https://dev.aniscroll.com/fr/anime/watch/";
  const VERDICTS = [
    ["juste","Juste"],["debut","Début faux"],["fin","Fin fausse"],
    ["pas","Pas un générique"],["manque","Il en manque un"]
  ];
  let cells = [], verdicts = {}, db = null, filter = "todo", animeSel = "";
  const $ = (id) => document.getElementById(id);

  const mmss = (t) => {
    if (t == null) return "—";
    const s = Math.max(0, t), m = Math.floor(s/60);
    return m + ":" + (s - m*60).toFixed(1).padStart(4,"0");
  };
  const parseMmss = (v) => {
    const m = String(v||"").trim().match(/^(\d+):(\d{1,2}(?:[.,]\d+)?)$/);
    return m ? (+m[1])*60 + parseFloat(m[2].replace(",",".")) : null;
  };
  const link = (c, host, t) => {
    const p = new URLSearchParams({num:String(c.ep), server:host.server, t:String(Math.max(0, Math.floor(t)))});
    if (c.lang === "vf") p.set("dub","true");
    return DEV + c.aniId + "/x?" + p.toString();
  };
  const needsLuc = (c) => c.check === true;

  function el(tag, attrs, ...kids){
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs||{})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  }

  function renderStats(){
    const todo = cells.filter(needsLuc);
    const done = todo.filter(c => verdicts[c.id]);
    // Accord : sur les lignes que j'ai jugées OK ET que tu as vérifiées.
    const sample = cells.filter(c => c.claude && c.claude.v === "ok" && verdicts[c.id]);
    const agree = sample.filter(c => verdicts[c.id].v === "juste").length;
    const stats = [
      [todo.length - done.length, "à vérifier"],
      [done.length + " / " + todo.length, "vérifiées"],
      [sample.length ? Math.round(100*agree/sample.length) + " %" : "—", "accord sur mes OK (" + sample.length + ")"],
      [cells.length, "lignes au total"],
    ];
    $("stats").replaceChildren(...stats.map(([b,s]) => el("div",{class:"stat"}, el("b",{text:String(b)}), el("span",{text:s}))));
  }

  async function save(c, patch){
    const cur = Object.assign({}, verdicts[c.id] || {});
    const next = Object.assign(cur, patch, {at: new Date().toISOString()});
    verdicts[c.id] = next;
    render();
    if (!db) return;
    try { await db.collection("verdicts").doc(c.id).set(next); }
    catch(e){ showNote("Enregistrement refusé (" + (e && e.code || "erreur") + ") : le verdict reste affiché ici mais n'est pas sauvegardé."); }
  }

  function row(c){
    const v = verdicts[c.id];
    const hostsLine = el("div",{class:"hosts"},
      ...c.hosts.map(h => el("span",{class:"host", text:h.host})));
    const cl = c.claude
      ? el("div",{class:"claude"}, el("span",{class:"pill " + c.claude.v, text:"Claude : " + c.claude.v}), el("span",{class:"muted", text:c.claude.why || ""}))
      : null;
    const h0 = c.hosts[0];
    const links = el("div",{class:"links"},
      c.start != null
        ? el("a",{class:"go", href:link(c,h0,c.start-3), target:"_blank", rel:"noopener"}, "▶ Début", el("span",{class:"tc", text:mmss(c.start)}))
        : el("a",{class:"go", href:link(c,h0,c.kind==="op"?0:Math.max(0,(c.duration||1440)-300)), target:"_blank", rel:"noopener"}, c.kind==="op" ? "▶ Depuis le début" : "▶ 5 min avant la fin"),
      c.end != null
        ? el("a",{class:"go", href:link(c,h0,c.end-3), target:"_blank", rel:"noopener"}, "▶ Fin", el("span",{class:"tc", text:mmss(c.end)}))
        : null,
      ...c.hosts.slice(1).map(h => el("a",{class:"go", href:link(c,h,(c.start??0)-3), target:"_blank", rel:"noopener", title:"Même encodage, autre lecteur"}, "▶ " + h.host)));
    const fix = el("div",{class:"fix"},
      el("label",{for:"s-"+c.id, text:"Bon début"}),
      el("input",{id:"s-"+c.id, class:"tc", placeholder:"m:ss", value:v && v.fixStart != null ? mmss(v.fixStart) : "",
        onchange:(e)=>{ const t = parseMmss(e.target.value); if (e.target.value && t == null){ e.target.value=""; return; } save(c,{fixStart:t}); }}),
      el("label",{for:"e-"+c.id, text:"Bonne fin"}),
      el("input",{id:"e-"+c.id, class:"tc", placeholder:"m:ss", value:v && v.fixEnd != null ? mmss(v.fixEnd) : "",
        onchange:(e)=>{ const t = parseMmss(e.target.value); if (e.target.value && t == null){ e.target.value=""; return; } save(c,{fixEnd:t}); }}));
    const verdict = el("div",{class:"verdict", role:"group", "aria-label":"Verdict"},
      ...VERDICTS.filter(([k]) => c.start != null || k === "juste" || k === "manque").map(([k,label]) =>
        el("button",{class:"btn v-"+k, "aria-pressed": String(!!(v && v.v === k)),
          text: c.start == null && k === "juste" ? "Rien à passer, c'est juste" : label,
          onclick:()=>save(c,{v:k})})));
    const sheet = c.sheet
      ? el("details",{}, el("summary",{text:"Planche d'images (ce que j'ai regardé)"}), el("img",{src:c.sheet, alt:"Planche d'images du " + c.kind.toUpperCase() + " épisode " + c.ep, loading:"lazy"}))
      : null;
    return el("div",{class:"row" + (v ? " done" : "")},
      el("div",{class:"where"}, "Ép. " + c.ep + (c.ep === c.lastEp ? " (dernier)" : ""), el("small",{text:c.lang.toUpperCase()})),
      el("div",{class:"kind " + c.kind, text:c.kind.toUpperCase()}),
      el("div",{class:"timing"},
        c.start != null
          ? el("b",{class:"tc", text:mmss(c.start) + " → " + mmss(c.end)})
          : el("b",{text:"rien détecté"}),
        el("div",{class:"src", text:c.source ? "preuve : " + c.source : ""})),
      el("div",{class:"body"}, hostsLine, cl, links, verdict, fix, sheet));
  }

  function render(){
    renderStats();
    let shown = cells;
    if (filter === "todo") shown = shown.filter(needsLuc);
    if (animeSel) shown = shown.filter(c => String(c.mal) === animeSel);
    if (!shown.length){
      $("list").replaceChildren(el("div",{class:"empty", text: cells.length ? "Rien à vérifier avec ce filtre." : "Aucune ligne pour l'instant."}));
      return;
    }
    const groups = new Map();
    for (const c of shown){ if (!groups.has(c.mal)) groups.set(c.mal, []); groups.get(c.mal).push(c); }
    const out = [];
    for (const [mal, list] of groups){
      list.sort((a,b)=> a.ep-b.ep || a.lang.localeCompare(b.lang) || a.kind.localeCompare(b.kind) || a.hosts[0].host.localeCompare(b.hosts[0].host));
      const f = list[0];
      out.push(el("section",{class:"anime"},
        el("div",{class:"anime-head"}, el("h2",{text:f.title}), el("span",{class:"tag", text:f.group}),
          el("span",{class:"muted", text:list.length + " ligne" + (list.length>1?"s":"")})),
        ...list.map(row)));
    }
    $("list").replaceChildren(...out);
  }

  function fillAnimeSelect(){
    const seen = new Map();
    for (const c of cells) seen.set(String(c.mal), c.title);
    const cur = $("f-anime").value;
    $("f-anime").replaceChildren(el("option",{value:"", text:"Tous"}),
      ...[...seen].map(([k,t]) => el("option",{value:k, text:t})));
    $("f-anime").value = cur;
  }
  function showNote(t){ $("note").textContent = t; $("note").hidden = false; }

  $("f-todo").onclick = () => { filter="todo"; $("f-todo").setAttribute("aria-pressed","true"); $("f-all").setAttribute("aria-pressed","false"); render(); };
  $("f-all").onclick = () => { filter="all"; $("f-all").setAttribute("aria-pressed","true"); $("f-todo").setAttribute("aria-pressed","false"); render(); };
  $("f-anime").onchange = (e) => { animeSel = e.target.value; render(); };

  (async () => {
    db = window.claude ? await window.claude.use("db") : null;
    if (!db){
      $("list").replaceChildren(el("div",{class:"empty", text:"Le relevé n'est pas accessible dans cette vue."}));
      return;
    }
    db.collection("cells").onSnapshot((snap) => {
      cells = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      fillAnimeSelect(); render();
    }, (e) => showNote("Lecture du relevé impossible (" + e.code + ")."));
    db.collection("verdicts").onSnapshot((snap) => {
      verdicts = {};
      for (const d of snap.docs) verdicts[d.id] = d.data();
      render();
    }, (e) => showNote("Lecture des verdicts impossible (" + e.code + ")."));
  })();
})();
</script>
